[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt"] }
futures-core = "0.3"
futures-util = "0.3"
sha2 = "0.10"
