[project]
name = "harness-provider-sdk"
version = "0.1.0"
description = "Python SDK for Harness Provider Protocol v1"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["harness_provider_sdk"]

[tool.setuptools.package-data]
