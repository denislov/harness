schema_version = 1

[runtime]
name = "harness-cli"
data_dir = ".harness"
default_profile = "default"

[observability]
runtime_events_jsonl = ".harness/runtime-events.jsonl"

# Secrets stay outside this file. A Provider can map one of these credential
# names into a subprocess environment key via its `credentials` table.
# [credentials.openai]
# source = "env"
# variable = "OPENAI_API_KEY"

[[providers]]
id = "example-python"
program = "python3"
args = ["providers/example-python/provider.py"]
request_timeout_ms = 5000
shutdown_timeout_ms = 2000
# credentials = { OPENAI_API_KEY = "openai" }

[profiles.default]
policy = "allow-all"
max_automatic_tool_attempts = 2

[profiles.default.model]
provider = "example-python"
model = "agent-model"
system = "Use the echo tool, then answer with its result."
timeout_ms = 5000
max_output_tokens = 256

[[profiles.default.tools]]
name = "echo"
provider = "example-python"
version = "1"
description = "Echo a JSON object through the Python provider"
parallel_safe = true
side_effect = "read-only"
timeout_ms = 5000
input_schema = { type = "object", properties = { text = { type = "string" } }, required = ["text"], additionalProperties = false }
